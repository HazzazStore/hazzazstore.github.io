<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090c">
  <title>Hazzaz Store | تشغيل PS4 HEN</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden;background:#08090c;color:#e7e9ee;font:15px/1.45 Arial,Tahoma,sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 48%,rgba(239,35,60,.18),transparent 29%),repeating-linear-gradient(120deg,rgba(255,255,255,.022) 0 1px,transparent 1px 34px);pointer-events:none}body:not(.log):after{content:"HAZZAZ STORE • TRUST & INTEGRITY • CORE BY RAW GAME";position:fixed;right:0;bottom:22px;left:0;color:rgba(255,255,255,.35);text-align:center;font-size:9px;font-weight:800;letter-spacing:1.7px}
    #brand{direction:ltr;position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;min-height:67px;padding:10px 26px;border-bottom:1px solid rgba(255,255,255,.09);background:rgba(8,9,12,.80)}.brand-name{display:flex;align-items:center;gap:11px}.mark{display:block;width:45px;height:45px;padding:2px;border:1px solid rgba(239,35,60,.82);border-radius:50%;object-fit:cover;background:#08090c;box-shadow:0 0 0 4px rgba(239,35,60,.07),0 0 25px rgba(239,35,60,.25)}#brand b{color:#fff;font-size:16px;font-weight:950;letter-spacing:1.4px}#brand b i{color:#ef233c;font-style:normal}#brand small{color:#ff6b7a;font-size:10px;font-weight:900;letter-spacing:1.2px}
    #spin{position:fixed;top:calc(50% - 14px);left:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border:3px solid rgba(255,255,255,.10);border-top-color:#ef233c;border-right-color:#8e101f;border-radius:17px 5px;box-shadow:0 0 36px rgba(239,35,60,.16);animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#loading,#msg,#success{position:fixed;top:calc(50% + 39px);right:18px;left:18px;text-align:center}#loading{color:rgba(255,255,255,.82);font-size:16px;font-weight:900}#loading small{display:block;direction:ltr;margin-top:8px;color:rgba(255,255,255,.38);font-size:9px;font-weight:800;letter-spacing:1.5px}#msg,#success{display:none;top:50%;transform:translateY(-50%)}#msg strong,#success strong{display:block;margin-bottom:8px;font-size:24px;font-weight:950}#msg span,#success span{color:rgba(255,255,255,.58);font-size:13px}#msg strong{color:#ff6b7a}#success strong{color:#8ce99a}#wrap{padding:0}#state,#out{display:none}body.done #spin,body.done #loading,body.fail #spin,body.fail #loading{display:none}body.done #success{display:block}body.fail #msg{display:block}body.log{overflow:auto}body.log:before,body.log #spin,body.log #loading,body.log #msg,body.log #success{display:none}body.log #wrap{padding:14px 18px}body.log #state{display:block;margin:0 0 8px;font-size:21px;font-weight:950}body.log #out{direction:ltr;display:block;height:calc(100vh - 122px);overflow-y:auto;padding:10px 12px;border:1px solid #3b1720;border-radius:7px;background:#0b0c10;color:#d5d7dc;white-space:pre-wrap;font:12px/1.45 Consolas,monospace}.ok,.safe{color:#8ce99a}.bad,.danger{color:#ff6b7a}.warn{color:#ffd166}code{color:#ff7586}@media(max-width:560px){#brand{padding:9px 15px}#brand b{font-size:14px}#brand small{font-size:9px}}@media(prefers-reduced-motion:reduce){#spin{animation-duration:1.6s}}
  </style>
</head>
<body>
  <div id="brand"><span class="brand-name"><img class="mark" src="./hazzaz-logo-red.jpg" alt="شعار Hazzaz Store"><b><i>HAZZAZ</i> STORE</b></span><small>PS4 • 13.XX</small></div>
  <div id="spin"></div><div id="loading">جارٍ تشغيل HEN…<small>PLEASE WAIT • DO NOT CLOSE THE PAGE</small></div><div id="msg"><strong>لم تكتمل العملية</strong><span>أعد تشغيل جهاز PS4 ثم حاول مرة أخرى.</span></div><div id="success"><strong>تم التشغيل بنجاح</strong><span>يمكنك الآن إغلاق المتصفح والعودة إلى القائمة الرئيسية.</span></div><div id="wrap"><div id="state"></div><div id="out"></div></div>
  <script type="module">import "./jb.js?v=11";</script>
</body>
</html>
