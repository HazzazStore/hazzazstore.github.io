<!doctype html>
<html class="landing" lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#08090c" />
    <title>Hazzaz Store | Afterglow 14.00</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Every run starts from here. The referrer guard in jb.js arms the chain
         only when it was reached from this page, so that a browser restoring
         its last session cannot re-run it unattended. -->
    <div id="brand"><b>HAZZAZ STORE <span class="engine-name">/ AFTERGLOW</span></b></div>

    <div class="shell">
      <img class="meme" src="../hazzaz-store-banner.jpg" alt="Hazzaz Store" />

      <main class="panel">
        <p class="lede">تشغيل GoldHEN عبر Afterglow<br /><span dir="ltr">PS4 13.52 / 14.00 • Beta</span></p>

        <form class="pick" id="pick">
          <label class="opt">
            <input type="radio" name="payload" value="hen" />
            <span>ps4-hen</span>
          </label>
          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" checked />
            <span>تشغيل تلقائي بعد 5 ثوانٍ</span>
          </label>

          <button class="btn" type="submit">تشغيل الآن</button>
          <p class="count" id="count"></p>
          <p class="count" id="cache" aria-live="polite"></p>
        </form>
      </main>
    </div>

    <p class="byline"><a href="../index.html">Hazzaz Store</a> &middot; by well0nez/m0zz &middot; <a href="https://github.com/HazzazStore/hazzazstore.github.io/tree/main/afterglow">المصدر والترخيص</a></p>
    <script src="launch.js"></script>
  </body>
</html>
